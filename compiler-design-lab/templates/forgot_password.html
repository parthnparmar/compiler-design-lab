{% extends "base.html" %}
{% block title %}Forgot Password - Compiler Design Lab{% endblock %}
{% block content %}
<style>
  .wrap{display:flex;justify-content:center;padding-top:40px}
  .box{background:#fff;border:1px solid #e8e8e8;border-radius:14px;padding:40px 36px;width:100%;max-width:420px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
  .gear-icon{background:#1a73e8;color:#fff;border-radius:10px;width:52px;height:52px;display:inline-flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:10px}
  .form-control{border-radius:8px;border:1px solid #ddd;font-size:14px;padding:10px 14px;width:100%}
  .form-control:focus{border-color:#1a73e8;box-shadow:0 0 0 3px rgba(26,115,232,.15);outline:none}
  .btn-submit{background:#1a73e8;color:#fff;border:none;width:100%;padding:11px;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;margin-top:4px}
  .btn-submit:hover{background:#1557b0}
  .alert-error{background:#fef2f2;border:1px solid #fca5a5;color:#b91c1c;border-radius:8px;padding:10px 14px;font-size:13.5px;margin-bottom:16px}
  .alert-success{background:#f0fdf4;border:1px solid #86efac;color:#166534;border-radius:8px;padding:10px 14px;font-size:13.5px;margin-bottom:16px}
  .hint-text{text-align:center;font-size:13px;color:#888;margin-top:16px}
  .hint-text a{color:#1a73e8;text-decoration:none}
  .mb-3{margin-bottom:16px}
</style>
<div class="wrap">
  <div class="box">
    <div style="text-align:center;margin-bottom:24px">
      <div class="gear-icon">🔒</div>
      <h4 style="font-size:20px;font-weight:700;color:#1a1a2e;margin:0">Forgot Password</h4>
      <p style="font-size:13px;color:#999;margin:4px 0 0">Enter your email to receive an OTP</p>
    </div>
    {% if error %}<div class="alert-error">⚠ {{ error }}</div>{% endif %}
    {% if message %}<div class="alert-success">✅ {{ message }}</div>{% endif %}
    <form method="POST">
      <div class="mb-3">
        <label style="font-size:13.5px;font-weight:600;color:#333;display:block;margin-bottom:6px">Email Address</label>
        <input type="email" name="email" class="form-control" placeholder="your@email.com" required>
      </div>
      <button type="submit" class="btn-submit">Send OTP</button>
    </form>
    <div class="hint-text"><a href="/login">← Back to Login</a></div>
  </div>
</div>
{% endblock %}
